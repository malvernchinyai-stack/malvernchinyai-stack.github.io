<style>
:root{
  --navy:#14286b; --navy-2:#1c357f; --navy-ink:#0e1c4d;
  --green:#2f9e41; --green-d:#237a32;
  --amber:#f7a01d; --amber-d:#d97e00;
  --blue:#1e5bb8;
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f7f9fc;
  --ink:#18202f; --muted:#69748a; --line:#e2e7f0;
  --danger:#c62828; --danger-bg:#fdecec;
  --ok:#237a32; --ok-bg:#e8f6ec;
  --warn:#a5670a; --warn-bg:#fdf3e2;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,40,107,.06),0 8px 24px rgba(20,40,107,.08);
  --shadow-sm:0 1px 3px rgba(20,40,107,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em;color:var(--navy-ink)}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--navy)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.03em}
.field{margin-bottom:14px}
.row{display:flex;gap:10px}
.row>.field{flex:1}
.hide{display:none!important}

/* App bar */
.appbar{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 60%,#20408f 100%);
  color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 14px rgba(14,28,77,.25)}
.appbar .brandmark{height:34px;width:auto;background:#fff;border-radius:9px;padding:4px 8px;box-shadow:var(--shadow-sm)}
.appbar .titles{flex:1;min-width:0}
.appbar .titles b{display:block;font-size:15px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.appbar .titles span{display:block;font-size:11px;opacity:.8;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .iconbtn{color:#fff;background:rgba(255,255,255,.14);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.sunstrip{height:3px;background:linear-gradient(90deg,var(--amber),#ffca5a,var(--green))}

/* Layout */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 24px}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 16px rgba(20,40,107,.06)}
.tab{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;
  color:var(--muted);font-size:10.5px;font-weight:700;border-radius:10px}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9}
.tab.active{color:var(--navy)}
.tab.active svg{stroke:var(--navy)}

/* Cards & bits */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.tight{padding:0;overflow:hidden}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec-title:first-child{margin-top:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;
  font-weight:800;font-size:14.5px;letter-spacing:.01em;transition:transform .08s,filter .15s;width:100%}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--navy);color:#fff}
.btn-amber{background:linear-gradient(135deg,var(--amber),var(--amber-d));color:#3a2500}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:var(--surface);color:var(--navy);border:1.5px solid var(--line)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid #f3c9c9}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.btn-row{display:flex;gap:10px}
.btn-row .btn{width:auto;flex:1}

/* Dashboard */
.hero{background:linear-gradient(125deg,var(--navy) 0%,#213c86 55%,#264aa0 100%);color:#fff;border-radius:18px;
  padding:18px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(247,160,29,.55),transparent 65%)}
.hero .greet{font-size:12.5px;opacity:.85;letter-spacing:.03em;text-transform:uppercase;font-weight:700}
.hero .amt{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.hero .amt small{font-size:15px;font-weight:700;opacity:.8}
.hero .sub{font-size:12.5px;opacity:.85}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.qa button{background:var(--surface);border-radius:16px;padding:16px 12px;box-shadow:var(--shadow);text-align:left;
  display:flex;flex-direction:column;gap:10px;transition:transform .08s}
.qa button:active{transform:scale(.98)}
.qa .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.qa .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.qa .ic.q{background:linear-gradient(135deg,var(--navy),#2a4aa0)}
.qa .ic.r{background:linear-gradient(135deg,var(--green),#39b24d)}
.qa b{font-size:15px;color:var(--navy-ink)}
.qa span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:13px 12px;box-shadow:var(--shadow-sm);text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--navy)}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;margin-top:2px}
.stat.amber .n{color:var(--amber-d)} .stat.green .n{color:var(--green-d)}

/* Lists */
.listitem{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.listitem:last-child{border-bottom:none}
.listitem:active{background:var(--surface-2)}
.li-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-weight:800;color:#fff;font-size:15px}
.li-main{flex:1;min-width:0}
.li-main b{display:block;font-size:14.5px;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-main span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-end{text-align:right;flex-shrink:0}
.li-end b{display:block;font-size:14.5px;color:var(--navy-ink)}
.li-end .badge{margin-top:3px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.b-draft{background:#eef1f6;color:#5a6480}
.b-issued{background:#e7edfb;color:#2a49a0}
.b-accepted,.b-paid{background:var(--ok-bg);color:var(--ok)}
.b-rejected,.b-cancelled,.b-expired{background:var(--danger-bg);color:var(--danger)}
.b-converted{background:#efe7fb;color:#6b3fb0}
.b-partial{background:var(--warn-bg);color:var(--warn)}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:52px;height:52px;stroke:#c4ccdb;fill:none;stroke-width:1.6;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty span{font-size:13px}

/* Search */
.search{position:relative;margin-bottom:14px}
.search input{padding-left:40px;border-radius:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

/* Page header */
.pghead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pghead .back{width:38px;height:38px;border-radius:11px;background:var(--surface);box-shadow:var(--shadow-sm);
  display:grid;place-items:center;flex-shrink:0}
.pghead .back svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.2}
.pghead h2{font-size:19px;flex:1}
.pghead .act{font-size:13px;font-weight:800;color:var(--blue);padding:8px}

/* line items */
.lineitem{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.lineitem .top{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.lineitem .top input{font-weight:700}
.lineitem .rm{width:34px;height:38px;flex-shrink:0;border-radius:9px;background:var(--danger-bg);color:var(--danger);
  display:grid;place-items:center;font-size:18px;font-weight:700}
.lineitem .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lineitem .grid3 label{font-size:10.5px}
.lineitem .lt{text-align:right;font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:700}
.lineitem .lt b{color:var(--navy-ink)}

/* totals */
.totals{background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-top:6px}
.totals .tr{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--muted)}
.totals .tr b{color:var(--ink);font-weight:700}
.totals .grand{border-top:2px solid var(--line);margin-top:8px;padding-top:12px;font-size:20px}
.totals .grand span{font-weight:800;color:var(--navy-ink)}
.totals .grand b{font-weight:800;color:var(--amber-d);font-size:22px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* template picker */
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left;transition:.15s}
.tpl.on{border-color:var(--navy);background:#f4f7ff}
.tpl b{display:block;font-size:13.5px;color:var(--navy-ink)}
.tpl span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tpl .mini{height:46px;border-radius:7px;margin-bottom:8px;background:linear-gradient(135deg,#dfe6f5,#eef2fa);position:relative;overflow:hidden}
.tpl .mini::before{content:"";position:absolute;left:8px;top:8px;right:8px;height:7px;border-radius:2px;background:var(--navy);opacity:.7}
.tpl .mini::after{content:"";position:absolute;left:8px;top:20px;width:40%;height:4px;border-radius:2px;background:var(--amber)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(14,28,77,.45);display:flex;align-items:flex-end;
  justify-content:center;animation:fade .15s}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:slideup .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.modal h3{font-size:18px;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--navy-ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;
  z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .2s;max-width:88%;text-align:center}
.toast.ok{background:var(--green-d)} .toast.err{background:var(--danger)}

.note{background:var(--warn-bg);border:1px solid #f0dcb0;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7a5410;margin-bottom:14px}
.note b{color:#5f4109}
.settings-grp{margin-bottom:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.toggle .tl b{display:block;font-size:14px;color:var(--navy-ink)}
.toggle .tl span{font-size:12px;color:var(--muted)}
.sw{width:46px;height:27px;border-radius:20px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--green)} .sw.on::after{left:22px}
.morelink{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.morelink:active{background:var(--surface-2)}
.morelink .mi{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center}
.morelink .mi svg{width:21px;height:21px;stroke:var(--navy);fill:none;stroke-width:1.9}
.morelink .mt{flex:1} .morelink .mt b{display:block;font-size:14.5px;color:var(--navy-ink)}
.morelink .mt span{font-size:12px;color:var(--muted)}
.morelink .ch{color:var(--muted);font-size:20px}

/* PDF PREVIEW / PRINT AREA */
#printArea{display:none}
@media screen{
  #printOverlay{position:fixed;inset:0;z-index:150;background:#4a5266;overflow:auto;padding:0}
  #printOverlay .pv-bar{position:sticky;top:0;background:var(--navy-ink);color:#fff;display:flex;gap:8px;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:2}
  #printOverlay .pv-bar b{flex:1;font-size:14px}
  #printOverlay .pv-bar button{color:#fff;background:rgba(255,255,255,.15);padding:9px 14px;border-radius:10px;font-weight:800;font-size:13px}
  #printOverlay .pv-bar button.go{background:var(--amber);color:#3a2500}
  #printOverlay .paper-wrap{padding:14px;display:flex;justify-content:center}
  .paper{background:#fff;width:100%;max-width:794px;box-shadow:0 6px 30px rgba(0,0,0,.4)}
}
</style>
</head>

/* ============ UTIL ============ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function sym(c){return c==='USD'?'$':'';}
function money(n,c){c=c||S.settings.currency;const v=(Math.round(num(n)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return c==='USD'?'$'+v:v+' '+c;}
function today(){return new Date().toISOString().slice(0,10);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);}
function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function pad4(n){return String(n).padStart(4,'0');}
function initials(s){return(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function colorFor(s){const c=['#14286b','#2f9e41','#1e5bb8','#d97e00','#6b3fb0','#0f7d8c'];let h=0;for(const ch of(s||''))h=ch.charCodeAt(0)+((h<<5)-h);return c[Math.abs(h)%c.length];}

const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words999(n){let s='';if(n>=100){s+=ONES[Math.floor(n/100)]+' hundred';n%=100;if(n)s+=' and ';}if(n>=20){s+=TENS[Math.floor(n/10)];n%=10;if(n)s+='-'+ONES[n];}else if(n>0)s+=ONES[n];return s;}
function numWords(n){n=Math.floor(n);if(n===0)return'zero';const parts=[];const scales=[['million',1e6],['thousand',1e3]];for(const[name,val]of scales){if(n>=val){parts.push(words999(Math.floor(n/val))+' '+name);n%=val;}}if(n>0)parts.push(words999(n));return parts.join(' ');}
function amountWords(n,c){n=Math.round(num(n)*100)/100;const d=Math.floor(n),cents=Math.round((n-d)*100);const cur=c==='USD'?['US Dollar','US Dollars']:[c,c];let s=numWords(d)+' '+(d===1?cur[0]:cur[1]);if(cents>0)s+=' and '+numWords(cents)+' cent'+(cents===1?'':'s');return(s.charAt(0).toUpperCase()+s.slice(1))+' only';}

function calc(d){let sub=0;(d.items||[]).forEach(it=>{sub+=(num(it.qty)*num(it.unitPrice))-num(it.discount);});
  const afterDisc=sub-num(d.overallDiscount);const charges=num(d.delivery)+num(d.installation);
  const taxable=afterDisc+charges;const tax=d.taxEnabled?taxable*(num(d.taxRate)/100):0;const total=taxable+tax;
  return{sub,disc:num(d.overallDiscount),charges,tax,total};}

  const converted=q.filter(d=>d.status==='converted'||d.status==='accepted').length;
  const recent=[...S.documents].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);
  return `

    <div class="greet">Collected this month</div>
    <div class="amt">${money(monthRec,S.settings.currency)}</div>
    <div class="sub">${r.length} receipt${r.length===1?'':'s'} • ${q.length} quotation${q.length===1?'':'s'} issued to date</div>
  </div>
  <div class="qa">
    <button onclick="newQuote()"><div class="ic q">${ic.doc}</div><b>New Quotation</b><span>Prepare &amp; share a quote</span></button>
    <button onclick="newReceipt()"><div class="ic r">${ic.receipt}</div><b>New Receipt</b><span>Record a payment</span></button>

    <div class="stat green"><div class="n">${converted}</div><div class="l">Converted</div></div>
  </div>
  <div class="sec-title"><h3>Recent activity</h3><button class="act" onclick="go('quotes')" style="background:none;color:var(--blue);font-weight:800;font-size:13px">View all</button></div>
  <div class="card tight">
    ${recent.length?recent.map(docListRow).join(''):emptyBox(ic.inbox,'No documents yet','Create your first quotation to get started.')}
  </div>`;
}

const QTPL=[['corporate','Corporate','Formal A4 — corporate clients'],['modern','Modern','Product-led — residential'],['project','Project','Multi-section — large installs'],['estimate','Estimate','Green-accent itemised estimate'],['letter','Letter','Business-letter style quote']];

function quoteActions(d,locked){
  if(!d.id){return `<div class="btn-row"><button class="btn btn-ghost" onclick="saveQuote('draft')">Save draft</button>
    <button class="btn btn-primary" onclick="saveQuote('issued')">Issue quotation</button></div>`;}
  let btns=`<div class="btn-row"><button class="btn btn-ghost" onclick="previewDoc()">${ic.pdf} PDF &amp; Share</button>`;
  if(!locked)btns+=`<button class="btn btn-primary" onclick="saveQuote('${d.status}')">Save changes</button>`;
  btns+='</div>';
  btns+=`<div class="btn-row" style="margin-top:10px">`;
  if(d.status==='draft')btns+=`<button class="btn btn-green" onclick="setStatus('issued')">Issue</button>`;
  if(d.status==='issued'){btns+=`<button class="btn btn-green" onclick="setStatus('accepted')">Accepted</button>
    <button class="btn btn-ghost" onclick="setStatus('rejected')">Rejected</button>`;}
  btns+=`</div>`;
  if(['issued','accepted'].includes(d.status))
    btns+=`<button class="btn btn-amber" style="margin-top:10px" onclick="convertToReceipt()">Convert to receipt</button>`;
  btns+=`<div class="btn-row" style="margin-top:10px">
     <button class="btn btn-ghost" onclick="reviseQuote()">Revise</button>
     <button class="btn btn-ghost" onclick="duplicateDoc()">Duplicate</button></div>`;
  if(d.status==='issued')btns+=`<button class="btn btn-ghost" style="margin-top:10px" onclick="setStatus('expired')">Mark expired</button>`;
  return btns;
}

function lineItemHtml(it,i,locked){
  const line=(num(it.qty)*num(it.unitPrice))-num(it.discount);
  return `<div class="lineitem" data-i="${i}">
    <div class="top">
      <input placeholder="Item name" value="${esc(it.name)}" oninput="editing.items[${i}].name=this.value" ${locked?'disabled':''}>
      ${locked?'':`<button class="rm" onclick="rmLine(${i})">&times;</button>`}
    </div>
    <input placeholder="Description (optional)" value="${esc(it.desc||'')}" oninput="editing.items[${i}].desc=this.value" style="margin-bottom:8px" ${locked?'disabled':''}>
    <div class="grid3">
      <div><label>Qty</label><input type="number" inputmode="decimal" value="${it.qty}" oninput="editing.items[${i}].qty=this.value;recalcLine(${i})" ${locked?'disabled':''}></div>
      <div><label>Unit price</label><input type="number" inputmode="decimal" value="${it.unitPrice}" oninput="editing.items[${i}].unitPrice=this.value;recalcLine(${i})" ${locked?'disabled':''}></div>
      <div><label>Discount</label><input type="number" inputmode="decimal" value="${it.discount||''}" oninput="editing.items[${i}].discount=this.value;recalcLine(${i})" ${locked?'disabled':''}></div>
    </div>
    <div class="lt">Line total: <b id="lt${i}">${money(line,editing.currency)}</b></div>
  </div>`;
}
function recalcLine(i){const it=editing.items[i];const line=(num(it.qty)*num(it.unitPrice))-num(it.discount);
  const el=document.getElementById('lt'+i);if(el)el.textContent=money(line,editing.currency);recalc();}
function addLine(){syncQuote();editing.items.push({name:'',desc:'',qty:1,unitPrice:0,discount:0});
  document.getElementById('items').innerHTML=editing.items.map((it,i)=>lineItemHtml(it,i,false)).join('');recalc();}
function rmLine(i){syncQuote();editing.items.splice(i,1);if(!editing.items.length)editing.items.push({name:'',desc:'',qty:1,unitPrice:0,discount:0});
  document.getElementById('items').innerHTML=editing.items.map((it,i)=>lineItemHtml(it,i,false)).join('');recalc();}
function totalsHtml(c,cur){
  let h=`<div class="tr"><span>Subtotal</span><b>${money(c.sub,cur)}</b></div>`;
  if(c.disc>0)h+=`<div class="tr"><span>Discount</span><b>− ${money(c.disc,cur)}</b></div>`;
  if(c.charges>0)h+=`<div class="tr"><span>Delivery &amp; installation</span><b>${money(c.charges,cur)}</b></div>`;
  if(c.tax>0)h+=`<div class="tr"><span>Tax</span><b>${money(c.tax,cur)}</b></div>`;
  h+=`<div class="tr grand"><span>Total</span><b>${money(c.total,cur)}</b></div>`;return h;
}
function recalc(){syncQuote(true);const c=calc(editing);const el=document.getElementById('totals');if(el)el.innerHTML=totalsHtml(c,editing.currency);}
function setTpl(t){syncQuote();editing.template=t;render();}
function syncQuote(light){const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  const dt=g('d_date');if(dt!==undefined)editing.date=dt;
  const ex=g('d_expiry');if(ex!==undefined)editing.expiryDate=ex;
  const pr=g('d_prep');if(pr!==undefined)editing.preparedBy=pr;
  const cu=g('d_cur');if(cu!==undefined)editing.currency=cu;
  editing.delivery=num(g('d_del'));editing.installation=num(g('d_inst'));
  editing.overallDiscount=num(g('d_disc'));editing.deposit=num(g('d_dep'));
  if(light)return;
  const nt=g('d_notes');if(nt!==undefined)editing.notes=nt;
  const tm=g('d_terms');if(tm!==undefined)editing.terms=tm;
  const py=g('d_pay');if(py!==undefined)editing.paymentInstr=py;
}
function customerSelect(d){
  const opts=S.customers.sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${d.customerId===c.id?'selected':''}>${esc(c.name)}${c.company?' ('+esc(c.company)+')':''}</option>`).join('');
  const locked=d.type==='quotation'?(!editable(d)&&d.id):(d.id&&d.status!=='draft');
  return `<select id="d_cust" onchange="pickCustomer(this.value)" ${locked?'disabled':''}>
    <option value="">— Select customer —</option>${opts}<option value="__new">+ Add new customer…</option></select>`;
}
function pickCustomer(v){if(v==='__new'){quickAddCustomer();return;}editing.customerId=v;
  const c=S.customers.find(x=>x.id===v);editing.customerSnapshot=c?{name:c.name,company:c.company,phone:c.phone,email:c.email,address:c.address,tin:c.tin}:null;}

function saveQuote(status){syncQuote();
  if(!editing.customerId){return toast('Select a customer','err');}
  if(!editing.items.some(it=>it.name.trim())){return toast('Add at least one item','err');}
  editing.items=editing.items.filter(it=>it.name.trim());
  const isNew=!editing.id;
  if(isNew){editing.id=uid();editing.number=nextNumber('quotation');editing.createdAt=new Date().toISOString();}
  editing.status=status;editing.updatedAt=new Date().toISOString();
  const i=S.documents.findIndex(x=>x.id===editing.id);
  if(i>=0)S.documents[i]=editing;else S.documents.push(editing);
  save();toast(status==='issued'?'Quotation issued: '+editing.number:'Saved','ok');
  editing=JSON.parse(JSON.stringify(editing));render();
}
function setStatus(st){syncQuote();const d=S.documents.find(x=>x.id===editing.id);if(!d)return;
  const apply=()=>{d.status=st;d.updatedAt=new Date().toISOString();editing.status=st;save();toast('Marked '+st,'ok');render();};
  if(['rejected','expired'].includes(st))confirmModal('Mark as '+st+'?','',apply);else apply();
}
function reviseQuote(){const d=S.documents.find(x=>x.id===editing.id);if(!d)return;
  confirmModal('Revise quotation?','Creates an editable copy keeping the same number with a revision tag. The original stays on record.',()=>{
    const base=d.number.replace(/-R\d+$/,'');const rev=(S.documents.filter(x=>x.number.startsWith(base+'-R')).length)+1;
    const copy=JSON.parse(JSON.stringify(d));copy.id=uid();copy.number=base+'-R'+rev;copy.status='draft';
    copy.date=today();copy.createdAt=new Date().toISOString();S.documents.push(copy);save();
    editing=JSON.parse(JSON.stringify(copy));toast('Revision '+copy.number+' created','ok');go('quoteEdit',{isNew:false});});
}
function duplicateDoc(){const d=S.documents.find(x=>x.id===editing.id);if(!d)return;
  const copy=JSON.parse(JSON.stringify(d));copy.id=uid();copy.number=nextNumber(d.type);copy.status='draft';
  copy.date=today();if(d.type==='quotation')copy.expiryDate=addDays(today(),30);copy.createdAt=new Date().toISOString();
  S.documents.push(copy);save();editing=JSON.parse(JSON.stringify(copy));toast('Duplicated as '+copy.number,'ok');
  go(d.type==='quotation'?'quoteEdit':'receiptEdit',{isNew:false});
}
function convertToReceipt(){const d=S.documents.find(x=>x.id===editing.id);if(!d)return;
  const c=calc(d);
  const r=blankDoc('receipt');r.customerId=d.customerId;r.customerSnapshot=d.customerSnapshot;r.currency=d.currency;
  r.relatedQuotation=d.number;r.contractAmount=c.total;r.amountReceived=d.deposit>0?num(d.deposit):c.total;
  r.previouslyPaid=0;r.paymentDescription='Payment for quotation '+d.number;
  r.template=d.deposit>0?'deposit':'formal';
  d.status='converted';d.updatedAt=new Date().toISOString();save();
  editing=r;toast('Quotation converted — complete the receipt','ok');go('receiptEdit',{isNew:true});
}

  <div class="sec-title"><h3>Payment</h3></div>

    <div class="field"><label>Amount received *</label><input id="r_amt" type="number" inputmode="decimal" value="${d.amountReceived||''}" oninput="recalcReceipt()" ${locked?'disabled':''}></div>
    <div class="field"><label>Payment method</label><select id="r_method" ${locked?'disabled':''}>
      ${['Cash','Bank transfer','Mobile money','Card / swipe','Other'].map(m=>`<option ${d.paymentMethod===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="field"><label>Payment reference (optional)</label><input id="r_ref" value="${esc(d.paymentReference||'')}" ${locked?'disabled':''}></div>
    <div class="field"><label>Description</label><input id="r_desc" value="${esc(d.paymentDescription||'')}" ${locked?'disabled':''}></div>
    <div class="row"><div class="field"><label>Contract / total amount</label><input id="r_contract" type="number" inputmode="decimal" value="${d.contractAmount||''}" oninput="recalcReceipt()" ${locked?'disabled':''}></div>
      <div class="field"><label>Previously paid</label><input id="r_prev" type="number" inputmode="decimal" value="${d.previouslyPaid||''}" oninput="recalcReceipt()" ${locked?'disabled':''}></div></div>
    <div class="field"><label>Received by</label><input id="r_by" value="${esc(d.receivedBy||'')}" ${locked?'disabled':''}></div>
  </div>
  <div class="totals"><div class="tr"><span>This payment</span><b id="r_thisp">${money(d.amountReceived,d.currency)}</b></div>
    <div class="tr grand"><span>Balance remaining</span><b id="r_bal">${money(Math.max(0,bal),d.currency)}</b></div></div>

  <div class="sec-title"><h3>PDF template</h3></div>
  <div class="tpick">${RTPL.map(t=>`<button class="tpl ${d.template===t[0]?'on':''}" onclick="setRTpl('${t[0]}')"><div class="mini"></div><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}</div>

  <div style="height:14px"></div>
  ${receiptActions(d,locked)}
  `;
}
function receiptActions(d,locked){
  if(!d.id)return `<div class="btn-row"><button class="btn btn-ghost" onclick="saveReceipt('draft')">Save draft</button>
    <button class="btn btn-green" onclick="saveReceipt('issue')">Issue receipt</button></div>`;
  let h=`<div class="btn-row"><button class="btn btn-ghost" onclick="previewDoc()">${ic.pdf} PDF &amp; Share</button>`;
  if(!locked)h+=`<button class="btn btn-green" onclick="saveReceipt('issue')">Issue receipt</button>`;
  h+=`</div>`;
  h+=`<div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" onclick="duplicateDoc()">Duplicate</button>`;
  if(d.status!=='cancelled')h+=`<button class="btn btn-danger" onclick="cancelReceipt()">Cancel receipt</button>`;
  h+=`</div>`;return h;
}
function setRTpl(t){syncReceipt();editing.template=t;render();}
function recalcReceipt(){syncReceipt();const bal=num(editing.contractAmount)-num(editing.previouslyPaid)-num(editing.amountReceived);
  const a=document.getElementById('r_thisp'),b=document.getElementById('r_bal');
  if(a)a.textContent=money(editing.amountReceived,editing.currency);if(b)b.textContent=money(Math.max(0,bal),editing.currency);}
function syncReceipt(){const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  const m={r_date:'date',r_cur:'currency',r_rel:'relatedQuotation',r_method:'paymentMethod',r_ref:'paymentReference',r_desc:'paymentDescription',r_by:'receivedBy'};
  for(const k in m){const v=g(k);if(v!==undefined)editing[m[k]]=v;}
  editing.amountReceived=num(g('r_amt'));editing.contractAmount=num(g('r_contract'));editing.previouslyPaid=num(g('r_prev'));
}
function saveReceipt(mode){syncReceipt();
  if(!editing.customerId)return toast('Select a customer','err');
  if(num(editing.amountReceived)<=0)return toast('Enter the amount received','err');
  const isNew=!editing.id;
  if(isNew){editing.id=uid();editing.number=nextNumber('receipt');editing.createdAt=new Date().toISOString();}
  const bal=num(editing.contractAmount)-num(editing.previouslyPaid)-num(editing.amountReceived);
  if(mode==='issue')editing.status=(editing.contractAmount>0&&bal>0.005)?'partial':'paid';else editing.status='draft';
  editing.updatedAt=new Date().toISOString();
  const i=S.documents.findIndex(x=>x.id===editing.id);if(i>=0)S.documents[i]=editing;else S.documents.push(editing);
  save();toast(mode==='issue'?'Receipt issued: '+editing.number:'Draft saved','ok');
  editing=JSON.parse(JSON.stringify(editing));render();
}
function cancelReceipt(){promptModal('Cancel receipt','Enter a reason (kept on record):',(reason)=>{
  if(!reason)return;const d=S.documents.find(x=>x.id===editing.id);if(!d){editing.status='cancelled';}
  else{d.status='cancelled';d.cancelReason=reason;d.updatedAt=new Date().toISOString();}
  editing.status='cancelled';editing.cancelReason=reason;save();toast('Receipt cancelled');render();});
}
function quickAddCustomer(){promptModal('New customer','Customer or company name:',(name)=>{
  if(!name)return;const c={id:uid(),name:name.trim(),company:'',phone:'',email:'',address:'',tin:''};
  S.customers.push(c);save();editing.customerId=c.id;editing.customerSnapshot={name:c.name,company:'',phone:'',email:'',address:'',tin:''};

}
function pickProduct(){

function filterPick(){const t=(document.getElementById('psearch').value||'').toLowerCase();

  document.getElementById('pickList').innerHTML=list.length?list.map(pickRow).join(''):emptyBox(ic.search,'No matches','');}
function addProduct(id){const p=S.products.find(x=>x.id===id);if(!p)return;syncQuote();

  editing.items.push({name:p.name,desc:p.desc,qty:1,unitPrice:p.price,discount:0});closeModal();render();}

function viewReports(){
  const q=S.documents.filter(d=>d.type==='quotation');

  const byMethod={};rOk.forEach(d=>{byMethod[d.paymentMethod]=(byMethod[d.paymentMethod]||0)+num(d.amountReceived);});
  const outstanding=q.filter(d=>d.status==='issued');
  const byStatus=t=>q.filter(d=>d.status===t).length;
  return `

    <div class="stat"><div class="n">${q.length}</div><div class="l">Quotations</div></div>

  <div class="card">
    ${Object.keys(byMethod).length?Object.entries(byMethod).map(([k,v])=>regRow(k,money(v,S.settings.currency),true)).join(''):'<p style="color:var(--muted);text-align:center;margin:8px 0">No receipts yet.</p>'}

  <div style="height:8px"></div>
  <button class="btn btn-ghost" onclick="exportCSV()">Export all documents (CSV)</button>
  `;

/* ============ MODALS / TOAST ============ */
function showModal(title,sub,body,footer){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="grab"></div><h3>${esc(title)}</h3>${sub?`<div class="msub">${esc(sub)}</div>`:''}${body}${footer||''}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function confirmModal(title,sub,onYes){showModal(title,sub,
  `<div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
   <button class="btn btn-primary" id="_yes">Confirm</button></div>`);
  document.getElementById('_yes').onclick=()=>{closeModal();onYes();};}
function promptModal(title,sub,onOk){showModal(title,sub,
  `<div class="field" style="margin-top:6px"><input id="_pin" autofocus></div>
   <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
   <button class="btn btn-primary" id="_ok">OK</button></div>`);
  document.getElementById('_ok').onclick=()=>{const v=document.getElementById('_pin').value;closeModal();onOk(v);};}
let toastT;
function toast(msg,kind){clearTimeout(toastT);document.getElementById('toastRoot').innerHTML=`<div class="toast ${kind||''}">${esc(msg)}</div>`;
  toastT=setTimeout(()=>{document.getElementById('toastRoot').innerHTML='';},2600);}

/* ============ BACKUP ============ */
function openBackup(){showModal('Backup &amp; Restore','Your data lives only on this device. Export a backup regularly and after big changes.',
  `<button class="btn btn-primary" onclick="exportBackup()">${ic.share} Export backup file</button>
   <button class="btn btn-ghost" style="margin-top:10px" onclick="document.getElementById('importFile').click()">Import backup file</button>
   <input type="file" id="importFile" accept="application/json" class="hide" onchange="importBackup(this)">
   <p style="font-size:12px;color:var(--muted);margin-top:14px">${S.customers.length} customers • ${S.documents.length} documents • ${S.products.length} items</p>`);}
function download(name,text,type){const b=new Blob([text],{type:type||'application/json'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function exportBackup(){download('marimo-backup-'+today()+'.json',JSON.stringify(S,null,2));toast('Backup exported','ok');closeModal();}
function importBackup(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!data.documents||!data.settings)throw 0;
    confirmModal('Restore this backup?','This replaces all current data on the device.',()=>{S=data;S.settings=Object.assign(defaultState().settings,S.settings);save();toast('Backup restored','ok');go('home');});
  }catch(e){toast('Invalid backup file','err');}};rd.readAsText(f);}
function exportCSV(){const rows=[['Type','Number','Date','Customer','Status','Currency','Total/Amount','Method','Reference']];
  S.documents.forEach(d=>{const c=calc(d);const amt=d.type==='quotation'?c.total:num(d.amountReceived);
    rows.push([d.type,d.number,d.date,(d.customerSnapshot?d.customerSnapshot.name:''),d.status,d.currency,amt.toFixed(2),d.paymentMethod||'',d.paymentReference||'']);});
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  download('marimo-documents-'+today()+'.csv',csv,'text/csv');toast('CSV exported','ok');}

.p-bar{height:4px;background:linear-gradient(90deg,#14286b 0%,#14286b 55%,#f7a01d 55%,#f7a01d 78%,#2f9e41 78%);margin:14px 0 0;border-radius:2px}
.p-title{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 16px}
.p-title h1{font-size:26px;color:#14286b;letter-spacing:.02em;margin:0;font-weight:800}
.p-title .meta{text-align:right;font-size:11.5px;color:#14286b}
.p-title .meta b{color:#14286b}
.p-cols{display:flex;gap:20px;margin-bottom:18px}
.p-box{flex:1;background:#fff;border:1px solid #e6ebf4;border-radius:8px;padding:12px 14px}
.p-box .lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#14286b;font-weight:800;margin-bottom:5px}
.p-box b{color:#14286b;font-size:13px}
.p-box .ln{font-size:11.5px;color:#14286b;line-height:1.55}
table.p-items{width:100%;border-collapse:collapse;margin:6px 0 4px}
table.p-items th{background:#fff;color:#14286b;text-align:left;padding:9px 10px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:800;border-top:2px solid #14286b;border-bottom:2px solid #14286b}
table.p-items th.r,table.p-items td.r{text-align:right}
table.p-items th.c,table.p-items td.c{text-align:center}
table.p-items td{padding:9px 10px;border-bottom:1px solid #eaeef5;vertical-align:top;color:#14286b}
table.p-items tr:nth-child(even) td{background:#fff}
table.p-items .in{font-weight:700;color:#14286b}
table.p-items .id{color:#14286b;font-size:10.5px}
.p-tot{display:flex;justify-content:flex-end;margin-top:10px}
.p-tot table{min-width:270px;border-collapse:collapse}
.p-tot td{padding:5px 4px;font-size:12px;color:#14286b}
.p-tot td.v{text-align:right;color:#14286b;font-weight:700}
.p-tot tr.grand td{border-top:2px solid #14286b;padding-top:9px;font-size:15px;color:#14286b;font-weight:800}
.p-tot tr.grand td.v{color:#d97e00}
.p-tot tr.dep td{color:#237a32;font-weight:800}
.p-sec{margin-top:20px}
.p-sec h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#14286b;border-bottom:1.5px solid #e6ebf4;padding-bottom:5px;margin-bottom:8px}
.p-sec .txt{font-size:11.5px;color:#14286b;line-height:1.6;white-space:pre-line}
.p-bank{display:flex;gap:20px;margin-top:18px}
.p-bank .bk{flex:1;background:#fff;border:2px solid #14286b;color:#14286b;border-radius:8px;padding:14px 16px}
.p-bank .bk .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#d97e00;font-weight:800;margin-bottom:8px}
.p-bank .bk .r{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.p-bank .bk .r span{color:#14286b;font-weight:600}
.p-bank .bk .r b{color:#14286b;font-weight:800}
.p-sign{display:flex;gap:40px;margin-top:34px}
.p-sign .s{flex:1;text-align:center}
.p-sign .s .line{border-top:1.5px solid #5a6478;margin-bottom:6px;height:34px}
.p-sign .s .cap{font-size:10.5px;color:#14286b;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.p-foot{margin-top:26px;padding-top:12px;border-top:1px solid #e6ebf4;text-align:center;font-size:10px;color:#14286b}
.p-foot b{color:#237a32}
.p-wm{position:relative}
.p-badge{display:inline-block;padding:5px 14px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.p-amt-card{background:#fff;border:2px solid #14286b;color:#14286b;border-radius:10px;padding:16px 20px;text-align:center;margin:16px 0}
.p-amt-card .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#d97e00;font-weight:800}
.p-amt-card .v{font-size:30px;font-weight:800;margin-top:2px;color:#14286b}
.p-words{background:#fff;border:1px solid #f0dcb0;border-radius:8px;padding:10px 14px;font-size:11.5px;color:#14286b;margin-top:12px;font-weight:600}
.p-words b{color:#14286b}
/* compact receipt */
.p-slip{max-width:420px;margin:0 auto;border:2px solid #14286b;border-radius:12px;padding:24px;text-align:center}
.p-slip .rn{font-size:11px;color:#14286b;letter-spacing:.06em;font-weight:700}
.p-slip .amt{font-size:32px;color:#14286b;font-weight:800;margin:10px 0}
.p-slip table{width:100%;text-align:left;font-size:12px;margin-top:14px;border-collapse:collapse}
.p-slip table td{padding:6px 0;border-bottom:1px dashed #cfd6e6}
.p-slip table td.k{color:#14286b;font-weight:600} .p-slip table td.v{text-align:right;font-weight:700;color:#14286b}
.tpl-green .p-title h1{color:#2f9e41}
.tpl-green table.p-items th{background:#fff;color:#237a32;border-top-color:#2f9e41;border-bottom-color:#2f9e41}
.p-letter{margin:16px 0}
.p-letter .to{font-size:12px;color:#14286b;line-height:1.6;margin-bottom:12px}
.p-letter .to b{font-size:13px}
.p-letter p{font-size:12px;color:#14286b;line-height:1.7;margin:0 0 11px}
.p-ackband{background:#fff;border:2px solid #2f9e41;color:#14286b;border-radius:8px;padding:14px 20px;text-align:center;margin:12px 0}
.p-ackband .l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#237a32;font-weight:800}
.p-ackband .v{font-size:28px;font-weight:800;color:#14286b;margin-top:2px}
@media print{
  html,body{background:#fff!important}
  body>*{display:none!important}
  #printArea{display:block!important}
  #printArea,.mpaper{background:#fff!important}
  @page{size:A4;margin:0}
  .mpaper{padding:14mm 14mm}
}
</style>`;}

function pHeadHTML(){const co=S.company;
  return `<div class="p-head">
    <img class="p-logo" src="${LOGO_SRC}">
    <div class="p-co"><b>${esc(co.name)}</b>${esc(co.address)}<br>${esc(co.phone)}<br>${esc(co.email)} • ${esc(co.website)}</div>
  </div><div class="p-bar"></div>`;
}
function pPartyHTML(d){const c=d.customerSnapshot||{};
  return `<div class="p-box"><div class="lbl">Billed to</div><b>${esc(c.name||'—')}</b>
    <div class="ln">${c.company?esc(c.company)+'<br>':''}${c.address?esc(c.address)+'<br>':''}${c.phone?esc(c.phone)+'<br>':''}${c.email?esc(c.email):''}${c.tin?'<br>TIN: '+esc(c.tin):''}</div></div>`;
}
function pItemsHTML(d,label){const c=d.currency;
  return `<table class="p-items"><thead><tr>
    <th style="width:52%">${label||'Description'}</th><th class="c">Qty</th><th class="r">Unit Price</th><th class="r">Amount</th></tr></thead><tbody>
    ${d.items.map(it=>{const amt=(num(it.qty)*num(it.unitPrice))-num(it.discount);
      return `<tr><td><span class="in">${esc(it.name)}</span>${it.desc?'<br><span class="id">'+esc(it.desc)+'</span>':''}</td>
      <td class="c">${esc(it.qty)}</td><td class="r">${money(it.unitPrice,c)}</td><td class="r">${money(amt,c)}${num(it.discount)>0?'<br><span class="id">−'+money(it.discount,c)+'</span>':''}</td></tr>`;}).join('')}
  </tbody></table>`;
}
function pTotalsHTML(d){const c=calc(d),cur=d.currency;
  let rows=`<tr><td>Subtotal</td><td class="v">${money(c.sub,cur)}</td></tr>`;
  if(c.disc>0)rows+=`<tr><td>Discount</td><td class="v">− ${money(c.disc,cur)}</td></tr>`;
  if(num(d.delivery)>0)rows+=`<tr><td>Delivery</td><td class="v">${money(d.delivery,cur)}</td></tr>`;
  if(num(d.installation)>0)rows+=`<tr><td>Installation</td><td class="v">${money(d.installation,cur)}</td></tr>`;
  if(c.tax>0)rows+=`<tr><td>Tax (${d.taxRate}%)</td><td class="v">${money(c.tax,cur)}</td></tr>`;
  rows+=`<tr class="grand"><td>Total</td><td class="v">${money(c.total,cur)}</td></tr>`;
  if(num(d.deposit)>0)rows+=`<tr class="dep"><td>Deposit required</td><td class="v">${money(d.deposit,cur)}</td></tr>`;
  return `<div class="p-tot"><table>${rows}</table></div>`;
}
function pBankHTML(){const b=S.bank;
  return `<div class="p-bank"><div class="bk"><div class="lbl">Banking details</div>
    <div class="r"><span>Account name</span><b>${esc(b.accountName)}</b></div>
    <div class="r"><span>Bank</span><b>${esc(b.bankName)}</b></div>
    <div class="r"><span>Branch</span><b>${esc(b.branch)}</b></div>
    <div class="r"><span>Account number</span><b>${esc(b.accountNumber)}</b></div>
    <div class="r"><span>Currency</span><b>${esc(b.currency)}</b></div></div></div>`;
}
function pSignHTML(a,b){return `<div class="p-sign"><div class="s"><div class="line"></div><div class="cap">${a||'For Marimo Solar Energy'}</div></div>
  <div class="s"><div class="line"></div><div class="cap">${b||'Customer acceptance'}</div></div></div>`;}
function pFootHTML(){return `<div class="p-foot">${esc(S.company.tagline)} &nbsp;•&nbsp; <b>${esc(S.company.services)}</b></div>`;}
function pMetaHTML(d){const isQ=d.type==='quotation';
  return `<div class="meta"><b>${esc(d.number)}</b><br>Date: ${fmtDate(d.date)}${isQ&&d.expiryDate?'<br>Valid until: '+fmtDate(d.expiryDate):''}${d.preparedBy?'<br>By: '+esc(d.preparedBy):''}</div>`;}

/* ---- Quotation templates ---- */
function tplCorporate(d){return paperCSS()+`<div class="mpaper">${pHeadHTML()}
  <div class="p-title"><h1>QUOTATION</h1>${pMetaHTML(d)}</div>
  <div class="p-cols">${pPartyHTML(d)}<div class="p-box"><div class="lbl">Status</div><b>${d.status.toUpperCase()}</b><div class="ln">Currency: ${esc(d.currency)}</div></div></div>
  ${pItemsHTML(d)}${pTotalsHTML(d)}
  ${d.notes?`<div class="p-sec"><h4>Notes</h4><div class="txt">${nl2br(d.notes)}</div></div>`:''}
  ${d.paymentInstr?`<div class="p-sec"><h4>Payment instructions</h4><div class="txt">${nl2br(d.paymentInstr)}</div></div>`:''}
  ${pBankHTML()}
  ${d.terms?`<div class="p-sec"><h4>Terms &amp; conditions</h4><div class="txt">${nl2br(d.terms)}</div></div>`:''}
  ${pSignHTML()}${pFootHTML()}</div>`;}

function tplModern(d){const c=calc(d);return paperCSS()+`<div class="mpaper">${pHeadHTML()}
  <div class="p-title"><h1 style="color:#2f9e41">Your Solar Quote</h1>${pMetaHTML(d)}</div>
  <div class="p-cols">${pPartyHTML(d)}</div>
  ${pItemsHTML(d,'Your solar package')}
  <div class="p-amt-card"><div class="l">Total investment</div><div class="v">${money(c.total,d.currency)}</div>
    ${num(d.deposit)>0?'<div style="font-size:12px;color:#ffffff;font-weight:700;margin-top:4px">Deposit to start: '+money(d.deposit,d.currency)+'</div>':''}</div>
  ${(num(d.installation)>0||d.notes)?`<div class="p-sec"><h4>Installation &amp; notes</h4><div class="txt">${d.installation>0?'Professional installation and commissioning included.\n':''}${nl2br(d.notes||'')}</div></div>`:''}
  <div class="p-sec"><h4>Warranty &amp; support</h4><div class="txt">All equipment carries the manufacturer’s warranty. Marimo Solar provides after-sales support, maintenance and servicing.</div></div>
  ${pBankHTML()}${d.terms?`<div class="p-sec"><h4>Terms</h4><div class="txt">${nl2br(d.terms)}</div></div>`:''}
  ${pSignHTML()}${pFootHTML()}</div>`;}

function tplProject(d){const c=calc(d);return paperCSS()+`<div class="mpaper">${pHeadHTML()}
  <div class="p-title"><h1>PROJECT QUOTATION</h1>${pMetaHTML(d)}</div>
  <div class="p-cols">${pPartyHTML(d)}<div class="p-box"><div class="lbl">Project</div><b>Solar Supply &amp; Installation</b><div class="ln">Currency: ${esc(d.currency)}<br>Prepared: ${fmtDate(d.date)}</div></div></div>
  <div class="p-sec"><h4>1. Scope of supply</h4></div>
  ${pItemsHTML(d,'Equipment &amp; services')}
  <div class="p-sec"><h4>2. Charges &amp; project total</h4></div>
  ${pTotalsHTML(d)}
  <div class="p-sec"><h4>3. Payment milestones</h4><div class="txt">Deposit on order: ${num(d.deposit)>0?money(d.deposit,d.currency):'50% of total'}\nBalance on completion and commissioning: ${money(c.total-num(d.deposit),d.currency)}</div></div>
  ${d.notes?`<div class="p-sec"><h4>4. Project notes &amp; exclusions</h4><div class="txt">${nl2br(d.notes)}</div></div>`:''}
  <div class="p-sec"><h4>${d.notes?'5':'4'}. Warranty &amp; after-sales</h4><div class="txt">Manufacturer warranties apply to all equipment. Marimo Solar provides commissioning, training and ongoing maintenance support.</div></div>
  ${pBankHTML()}
  ${d.terms?`<div class="p-sec"><h4>Terms &amp; conditions</h4><div class="txt">${nl2br(d.terms)}</div></div>`:''}
  ${pSignHTML('For Marimo Solar Energy','Client authorisation')}${pFootHTML()}</div>`;}

/* ---- Receipt templates ---- */
function tplReceiptFormal(d){const cancelled=d.status==='cancelled';
  return paperCSS()+`<div class="mpaper">${pHeadHTML()}
  <div class="p-title"><h1 style="color:#2f9e41">RECEIPT</h1>
    <div class="meta"><b>${esc(d.number)}</b><br>Date: ${fmtDate(d.date)}${d.relatedQuotation?'<br>Ref quote: '+esc(d.relatedQuotation):''}</div></div>
  ${cancelled?'<div style="text-align:center;margin-bottom:10px"><span class="p-badge" style="background:#fdecec;color:#c62828">Cancelled — '+esc(d.cancelReason||'')+'</span></div>':''}
  <div class="p-cols">${pPartyHTML(d)}
    <div class="p-box"><div class="lbl">Payment</div><b>${esc(d.paymentMethod)}</b><div class="ln">${d.paymentReference?'Ref: '+esc(d.paymentReference)+'<br>':''}Currency: ${esc(d.currency)}</div></div></div>
  <div class="p-amt-card"><div class="l">Amount received</div><div class="v">${money(d.amountReceived,d.currency)}</div></div>
  <div class="p-words"><b>Amount in words:</b> ${esc(amountWords(d.amountReceived,d.currency))}</div>
  ${d.paymentDescription?`<div class="p-sec"><h4>For</h4><div class="txt">${nl2br(d.paymentDescription)}</div></div>`:''}
  ${num(d.contractAmount)>0?`<div class="p-tot"><table>
    <tr><td>Contract / total amount</td><td class="v">${money(d.contractAmount,d.currency)}</td></tr>
    ${num(d.previouslyPaid)>0?`<tr><td>Previously paid</td><td class="v">${money(d.previouslyPaid,d.currency)}</td></tr>`:''}
    <tr><td>This payment</td><td class="v">${money(d.amountReceived,d.currency)}</td></tr>
    <tr class="grand"><td>Balance remaining</td><td class="v">${money(Math.max(0,num(d.contractAmount)-num(d.previouslyPaid)-num(d.amountReceived)),d.currency)}</td></tr></table></div>`:''}
  ${pSignHTML('Received by'+(d.receivedBy?': '+esc(d.receivedBy):''),'Customer signature &amp; stamp')}
  ${pFootHTML()}</div>`;}

function tplReceiptCompact(d){return paperCSS()+`<div class="mpaper" style="padding:34px">
  <div class="p-slip">
    <img src="${LOGO_SRC}" style="height:44px;margin-bottom:10px">
    <div class="rn">RECEIPT ${esc(d.number)}</div>
    <div class="amt">${money(d.amountReceived,d.currency)}</div>
    ${d.status==='cancelled'?'<div class="p-badge" style="background:#fdecec;color:#c62828;margin-bottom:8px">Cancelled</div>':''}
    <table>
      <tr><td class="k">Received from</td><td class="v">${esc(d.customerSnapshot?d.customerSnapshot.name:'—')}</td></tr>
      <tr><td class="k">Date</td><td class="v">${fmtDate(d.date)}</td></tr>
      <tr><td class="k">Method</td><td class="v">${esc(d.paymentMethod)}</td></tr>
      ${d.paymentReference?`<tr><td class="k">Reference</td><td class="v">${esc(d.paymentReference)}</td></tr>`:''}
      ${d.paymentDescription?`<tr><td class="k">For</td><td class="v">${esc(d.paymentDescription)}</td></tr>`:''}
      ${d.relatedQuotation?`<tr><td class="k">Quote</td><td class="v">${esc(d.relatedQuotation)}</td></tr>`:''}
    </table>
    <div style="border-top:1.5px solid #5a6478;margin-top:26px;padding-top:6px;font-size:10.5px;color:#14286b;font-weight:700">Authorised signature${d.receivedBy?' — '+esc(d.receivedBy):''}</div>
  </div>
  ${pFootHTML()}</div>`;}

function tplReceiptDeposit(d){const bal=Math.max(0,num(d.contractAmount)-num(d.previouslyPaid)-num(d.amountReceived));
  return paperCSS()+`<div class="mpaper">${pHeadHTML()}
  <div class="p-title"><h1 style="color:#d97e00">PART-PAYMENT RECEIPT</h1>
    <div class="meta"><b>${esc(d.number)}</b><br>Date: ${fmtDate(d.date)}${d.relatedQuotation?'<br>Ref quote: '+esc(d.relatedQuotation):''}</div></div>
  <div class="p-cols">${pPartyHTML(d)}
    <div class="p-box"><div class="lbl">Payment</div><b>${esc(d.paymentMethod)}</b><div class="ln">${d.paymentReference?'Ref: '+esc(d.paymentReference):''}</div></div></div>
  <div class="p-tot" style="justify-content:stretch"><table style="width:100%">
    <tr><td>Contract / total amount</td><td class="v">${money(d.contractAmount,d.currency)}</td></tr>
    <tr><td>Previously paid</td><td class="v">${money(d.previouslyPaid,d.currency)}</td></tr>
    <tr class="dep"><td>Payment received now</td><td class="v">${money(d.amountReceived,d.currency)}</td></tr>
    <tr class="grand"><td>Balance remaining</td><td class="v">${money(bal,d.currency)}</td></tr></table></div>

  ${d.paymentDescription?`<div class="p-sec"><h4>For</h4><div class="txt">${nl2br(d.paymentDescription)}</div></div>`:''}
  ${pBankHTML()}
  ${pSignHTML('Received by'+(d.receivedBy?': '+esc(d.receivedBy):''),'Customer signature')}
  ${pFootHTML()}</div>`;}

/* ---- New quotation template: Estimate (green accent) ---- */

/* ---- New quotation template: Letter (business-letter style) ---- */
function tplLetter(d){const cust=d.customerSnapshot||{};const first=esc((cust.name||'Client').split(' ')[0]);
  return paperCSS()+`<div class="mpaper">${pHeadHTML()}
  <div class="p-letter">
    <div style="text-align:right;font-size:11.5px;color:#14286b;margin:14px 0 12px">${fmtDate(d.date)}<br><b>Ref: ${esc(d.number)}</b></div>
    <div class="to"><b>${esc(cust.name||'—')}</b>${cust.company?'<br>'+esc(cust.company):''}${cust.address?'<br>'+esc(cust.address):''}${cust.phone?'<br>'+esc(cust.phone):''}</div>
    <p><b>Dear ${first},</b></p>
    <p>Thank you for your enquiry with Marimo Solar Energy. We are pleased to provide our quotation for the supply${num(d.installation)>0?' and installation':''} of solar equipment, as detailed below. This quotation is valid until <b>${fmtDate(d.expiryDate)}</b>.</p>
  </div>
  ${pItemsHTML(d)}${pTotalsHTML(d)}
  <div class="p-letter">
    <p>${d.notes?nl2br(d.notes)+'<br><br>':''}We would be glad to proceed upon your confirmation. Our banking details are shown below. Please do not hesitate to contact us should you require any clarification.</p>
    <p>Yours faithfully,<br><br><b>${esc(d.preparedBy||'Marimo Solar Energy')}</b><br>Marimo Solar Energy (Private) Limited</p>
  </div>
  ${pBankHTML()}
  ${d.terms?`<div class="p-sec"><h4>Terms &amp; conditions</h4><div class="txt">${nl2br(d.terms)}</div></div>`:''}
  ${pSignHTML()}${pFootHTML()}</div>`;}

/* ---- New receipt template: Official (green acknowledgement) ---- */
function tplReceiptOfficial(d){const cust=d.customerSnapshot||{};const bal=Math.max(0,num(d.contractAmount)-num(d.previouslyPaid)-num(d.amountReceived));
  return paperCSS()+`<div class="mpaper tpl-green">${pHeadHTML()}
  <div class="p-title"><h1>OFFICIAL RECEIPT</h1>
    <div class="meta"><b>${esc(d.number)}</b><br>Date: ${fmtDate(d.date)}${d.relatedQuotation?'<br>Ref quote: '+esc(d.relatedQuotation):''}</div></div>
  ${d.status==='cancelled'?'<div style="text-align:center;margin-bottom:10px"><span class="p-badge" style="background:#fdecec;color:#c62828">Cancelled — '+esc(d.cancelReason||'')+'</span></div>':''}
  <div class="p-sec" style="margin-top:6px"><div class="txt" style="font-size:13px">Received with thanks from <b>${esc(cust.name||'—')}</b>${cust.company?' ('+esc(cust.company)+')':''} the sum of:</div></div>
  <div class="p-ackband"><div class="l">Amount received — ${esc(d.paymentMethod)}</div><div class="v">${money(d.amountReceived,d.currency)}</div></div>
  <div class="p-words"><b>In words:</b> ${esc(amountWords(d.amountReceived,d.currency))}</div>
  <div class="p-cols" style="margin-top:16px">
    <div class="p-box"><div class="lbl">Being payment for</div><b style="font-size:12px;font-weight:600">${esc(d.paymentDescription||'Solar goods and services')}</b></div>
    <div class="p-box"><div class="lbl">Payment details</div><div class="ln">${d.paymentReference?'Reference: '+esc(d.paymentReference)+'<br>':''}Method: ${esc(d.paymentMethod)}<br>Currency: ${esc(d.currency)}</div></div>
  </div>
  ${num(d.contractAmount)>0?`<div class="p-tot"><table>
    <tr><td>Contract / total amount</td><td class="v">${money(d.contractAmount,d.currency)}</td></tr>
    ${num(d.previouslyPaid)>0?`<tr><td>Previously paid</td><td class="v">${money(d.previouslyPaid,d.currency)}</td></tr>`:''}
    <tr class="dep"><td>This payment</td><td class="v">${money(d.amountReceived,d.currency)}</td></tr>
    <tr class="grand"><td>Balance remaining</td><td class="v">${money(bal,d.currency)}</td></tr></table></div>`:''}
  ${pBankHTML()}
  ${pSignHTML('Received by'+(d.receivedBy?': '+esc(d.receivedBy):''),'Customer signature')}
  ${pFootHTML()}</div>`;}

function buildPaper(d){
  if(d.type==='quotation'){return d.template==='modern'?tplModern(d):d.template==='project'?tplProject(d):d.template==='estimate'?tplEstimate(d):d.template==='letter'?tplLetter(d):tplCorporate(d);}
  return d.template==='compact'?tplReceiptCompact(d):d.template==='deposit'?tplReceiptDeposit(d):d.template==='official'?tplReceiptOfficial(d):tplReceiptFormal(d);
}

/* ---- preview / print ---- */
function previewDoc(){
  if(ui.view==='quoteEdit')syncQuote();else if(ui.view==='receiptEdit')syncReceipt();
  const d=editing;
  if(!d.number){d._preview=true;d.number=(d.type==='quotation'?'QTN':'RCT')+'-DRAFT';}
  const html=buildPaper(d);
  document.getElementById('printArea').innerHTML=html;
  document.getElementById('printRoot').innerHTML=`<div id="printOverlay">
    <div class="pv-bar"><button onclick="closePreview()">✕ Close</button><b>Preview — ${esc(d.number)}</b>
      <button class="go" onclick="doPrint()">${ic.pdf} Save as PDF</button></div>
    <div class="paper-wrap"><div class="paper">${html}</div></div>
    <div style="text-align:center;padding:8px 16px 30px;color:#cfd6e6;font-size:12px">Tap “Save as PDF”, choose <b>Save as PDF</b> as the printer, then share the file on WhatsApp or email.</div>
  </div>`;
}
function closePreview(){document.getElementById('printRoot').innerHTML='';document.getElementById('printArea').innerHTML='';}
function doPrint(){window.print();}

/* ============ INIT ============ */
loadState();render();





</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
